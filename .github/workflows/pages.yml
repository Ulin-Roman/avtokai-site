name: Deploy portfolio preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    # Importing the source into a private repository must not publish it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build isolated static preview
        run: python3 build-preview.py --source-root . --output dist-preview --base-path "/${{ github.event.repository.name }}/"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
